name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx eslint .

      # Blocking on critical only. The one outstanding high is sharp's libvips
      # CVEs, reachable solely through next/image; this app serves no
      # user-supplied images and clearing it means a major Next upgrade. New
      # highs still show up in the non-blocking step below.
      - name: Audit (blocking on critical)
        run: npm audit --omit=dev --audit-level=critical
      - name: Audit (report highs)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - run: npx next build
        env:
          # Every page is dynamic, so the build never calls Supabase -- these only
          # satisfy the client constructors' presence checks.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
